<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
    <title>🔥 S7 VUA ĐỌC VỊ SUNWIN</title>
    <link rel="stylesheet" href="https://files.catbox.moe/0xyec8.css">
</head>
<body>
    <div id="login-screen" style="position:fixed; inset:0; background:#000; z-index:9999999; display:flex; justify-content:center; align-items:center; font-family:Arial;">
        <div style="width:300px; padding:30px; background:#111; border:2px solid #ff00c8; border-radius:20px; text-align:center; box-shadow:0 0 20px #ff00c8;">
            <h2 style="color:#ff00c8; margin-bottom:20px; text-shadow: 0 0 10px #ff00c8;">HỆ THÔNG S7 PRIME</h2>
            <input type="password" id="input-key" placeholder="Nhập Key VIP..." style="width:100%; padding:12px; border-radius:8px; border:1px solid #ff00c8; background:#000; color:#fff; margin-bottom:15px; text-align:center;">
            <button id="btn-login" style="width:100%; padding:12px; border-radius:8px; border:none; background:#ff00c8; color:#fff; font-weight:bold; cursor:pointer;">VÀO HỆ THỐNG</button>
            <p id="login-msg" style="color:red; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <iframe id="gameFrame" class="game-frame" src="https://web.sunwin.ke/" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-top-navigation allow-popups-to-escape-sandbox allow-storage-access-by-user-activation" style="display: none;"></iframe>
    
    <div class="mock-bg" id="mock-bg" style="display: none;"></div>
    <div class="info-note" id="info-note" style="display: none;">KING S7 VIP LMT – Giao diện demo (kéo thả, double-click thu gọn)</div>
    <div id="onlineTag" style="display: none;">● S7 ONLINE</div>

    <script src="https://files.catbox.moe/b4mse6.js"></script>
</body>
</html>
